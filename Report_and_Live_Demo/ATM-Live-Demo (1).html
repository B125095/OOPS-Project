<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATM Simulator – Live Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050818;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;color:#eef2ff}
button,input{font-family:inherit}
#st{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:radial-gradient(ellipse at 40% 35%,#1a1f66,#0a0f33 55%,#050818);overflow:hidden}
#fl{position:absolute;left:-300px;right:-300px;bottom:-330px;height:620px;background:repeating-linear-gradient(0deg,#22d3ee26 0 2px,transparent 2px 64px),repeating-linear-gradient(90deg,#22d3ee26 0 2px,transparent 2px 90px);transform:perspective(560px) rotateX(64deg);-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
#trk{position:absolute;left:40px;right:40px;top:22px;display:flex;gap:10px;z-index:5}
.chip{flex:1;text-align:center;padding:9px 0;border-radius:22px;background:#121a47;color:#8fa0d8;font-size:21px;font-weight:700;transition:.4s}
.chip.on{background:#fbbf24;color:#0b1230;box-shadow:0 0 26px #fbbf24aa;transform:scale(1.08)}
.chip.dn{background:#15803d;color:#fff}
#ctl{position:absolute;left:40px;bottom:10px;z-index:5;display:flex;gap:14px}
#ctl button{background:#ffffff14;border:1px solid #ffffff44;color:#c7d2fe;font-size:18px;padding:6px 16px;border-radius:20px;cursor:pointer}
#sc{position:absolute;left:0;top:96px;width:1080px;height:790px;perspective:2400px}
#atw{position:absolute;left:40px;top:20px;width:1000px;height:720px;transform-style:preserve-3d;animation:sw 14s ease-in-out infinite}
#atm{position:absolute;left:0;top:0;width:1000px;height:720px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s}
@keyframes sw{0%,100%{transform:rotateY(-2.5deg) rotateX(.6deg)}50%{transform:rotateY(2.5deg) rotateX(-.6deg)}}
.fa{position:absolute;border:3px solid #6c7bd6;border-radius:18px}
#fr{width:1000px;height:720px;background:linear-gradient(180deg,#3a4cae,#1a2468);transform:translateZ(70px);box-shadow:0 60px 80px #000a}
#lf,#rt{width:140px;height:720px;left:430px;background:repeating-linear-gradient(180deg,#27348a 0 24px,#1b2670 24px 30px)}
#lf{transform:rotateY(-90deg) translateZ(500px)}#rt{transform:rotateY(90deg) translateZ(500px)}
#tp{width:1000px;height:140px;top:290px;background:#5a6bd0;transform:rotateX(90deg) translateZ(360px)}
.brand{position:absolute;left:0;top:20px;width:100%;text-align:center;font:800 34px Arial;color:#fbbf24;letter-spacing:6px}
#scw{position:absolute;left:90px;top:80px;width:820px;height:460px;background:#04141f;border:9px solid #0b1236;border-radius:24px;overflow:hidden;box-shadow:inset 0 0 50px #22d3ee55}
.scr{position:absolute;inset:0;padding:22px 34px;display:flex;flex-direction:column;justify-content:center;color:#a7f3d0;font-size:24px;line-height:1.35}
.scr.in{animation:fi .45s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.scr h1{margin:0 0 8px;font-size:42px;color:#7df9ff}.scr p{margin:4px 0}
.bt{background:#0c3a52;border:2px solid #22d3ee;color:#e6fbff;font-size:24px;font-weight:700;padding:14px 22px;border-radius:14px;cursor:pointer;transition:.2s}
.bt:hover{background:#13607f;transform:translateY(-2px);box-shadow:0 0 22px #22d3ee88}
.bt.pr{background:#fbbf24;border-color:#fde68a;color:#0b1230}
.bt.sel{background:#22d3ee;color:#04141f}
.rw{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}.rw>*{flex:1}
.fl{display:flex;flex-direction:column;gap:3px;flex:1}.fl label{font-size:19px;color:#8fe9d6}
input{width:100%;font-size:25px;padding:8px 14px;background:#062a3a;border:2px solid #22d3ee;border-radius:10px;color:#fff;outline:none}
input:focus{box-shadow:0 0 18px #22d3ee99}
.er{color:#ff8fa3;min-height:30px;font-size:21px}
.tl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:12px}
.tl .bt{display:flex;align-items:center;gap:12px;text-align:left;font-size:23px}
.tl b{width:38px;height:38px;border-radius:50%;background:#fbbf24;color:#0b1230;display:flex;align-items:center;justify-content:center;flex:none}
.dots{display:flex;gap:18px;margin:14px 0}.dots i{width:30px;height:30px;border-radius:50%;border:3px solid #22d3ee}.dots i.f{background:#7df9ff;box-shadow:0 0 16px #7df9ff}
.kp{display:grid;grid-template-columns:repeat(3,88px);gap:10px}.kp .bt{padding:12px 0;text-align:center;font-size:26px}
.big{font-size:70px;font-weight:800;color:#fff;margin:6px 0}
.sp{width:70px;height:70px;border-radius:50%;border:8px solid #0e4a63;border-top-color:#7df9ff;animation:spn 0.9s linear infinite;margin:10px 0}
@keyframes spn{to{transform:rotate(360deg)}}
.shk{animation:shk .45s}@keyframes shk{20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
.ic{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:800;color:#04141f;margin-bottom:6px}
.tx{display:flex;justify-content:space-between;font-size:22px;padding:5px 0;border-bottom:1px solid #12556e}
.hold{display:flex;gap:30px;align-items:center}
.led{position:absolute;border-radius:6px;background:#050816;border:2px solid #6c7bd6}
.led.act{box-shadow:0 0 30px 8px #34d399;border-color:#34d399;animation:pl .6s infinite alternate}
@keyframes pl{to{box-shadow:0 0 12px 2px #34d399}}
.lbl{position:absolute;font-size:22px;font-weight:700;color:#a5b4fc;letter-spacing:3px}
.bill{position:absolute;width:210px;height:70px;border-radius:6px;background:linear-gradient(135deg,#34d399,#059669);border:2px solid #a7f3d0;opacity:0;color:#064e3b;font:800 26px/66px Arial;text-align:center}
.bo{animation:bo 1.6s ease-out forwards}.bi{animation:bi 1.6s ease-in forwards}
@keyframes bo{0%{top:26px;opacity:0}15%{opacity:1}100%{top:78px;opacity:1}}
@keyframes bi{0%{top:78px;opacity:1}85%{opacity:1}100%{top:26px;opacity:0}}
#show{position:absolute;left:1090px;top:170px;width:480px;height:520px;perspective:1400px}
#hint{position:absolute;left:40px;top:134px;width:400px;height:252px;border:3px dashed #5b6bd0;border-radius:26px;display:flex;align-items:center;justify-content:center;color:#7f8fe0;font-size:25px;text-align:center}
#cw{position:absolute;left:40px;top:134px;width:400px;height:252px;transform-style:preserve-3d;animation:fl 5s ease-in-out infinite;transition:opacity .6s}
#cw.fly{animation:none}
@keyframes fl{0%,100%{transform:translateY(-12px) rotateY(-18deg) rotateX(6deg)}50%{transform:translateY(14px) rotateY(18deg) rotateX(-4deg)}}
#card{position:absolute;inset:0;transform-style:preserve-3d;opacity:0}
#card.in{opacity:1;animation:dr 1.1s cubic-bezier(.2,.8,.2,1)}
@keyframes dr{from{opacity:0;transform:translateY(-320px) rotateX(75deg) scale(.6)}to{opacity:1;transform:none}}
.cf{position:absolute;inset:0;border-radius:22px;color:#fff;overflow:hidden;border:2px solid #8e9bff;box-shadow:0 30px 60px #000a;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cfr{background:linear-gradient(135deg,#1e2a78,#5b3df5 62%,#a855f7)}
.cbk{background:linear-gradient(135deg,#0b1230,#26357f);transform:rotateY(180deg)}
.cf .b1{position:absolute;left:22px;top:18px;font-weight:800;font-size:19px;letter-spacing:3px}
.cf .ct{position:absolute;right:22px;top:18px;font-weight:700;font-size:15px;color:#fde68a}
.chip2{position:absolute;left:22px;top:62px;width:58px;height:44px;border-radius:9px;background:linear-gradient(135deg,#fde68a,#f59e0b)}
.pr2{position:absolute;inset:0;clip-path:inset(0 0 0 0)}
.pr2.p{animation:prt 2s linear}
@keyframes prt{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.no{position:absolute;left:22px;top:128px;font:700 34px 'Courier New',monospace;letter-spacing:5px;color:#6ee7b7}
.nm{position:absolute;left:22px;top:184px;font-weight:700;font-size:25px;max-width:350px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl{position:absolute;left:22px;top:219px;font-size:15px;color:#c7d2fe}
.cf .sh{position:absolute;left:-100px;top:0;width:70px;height:100%;background:#fff;opacity:.15;transform:skewX(-20deg);animation:shm 4s linear infinite}
@keyframes shm{to{left:460px}}
.bar{position:absolute;left:0;top:42px;width:100%;height:50px;background:#050816}
.scn{position:absolute;left:0;top:-60px;width:100%;height:60px;background:linear-gradient(transparent,#6ee7b7aa,#6ee7b7);box-shadow:0 8px 30px #34d399;opacity:0}
#card.scanning .scn{opacity:1;animation:sn 1s ease-in-out 2 alternate}
@keyframes sn{from{top:-60px}to{top:252px}}
#card.okc .cf{border-color:#34d399;box-shadow:0 0 50px #34d399}
#scanb{position:absolute;left:1130px;top:735px;display:none;font-size:30px;padding:16px 46px;border-radius:40px;border:0;background:#fbbf24;color:#0b1230;font-weight:800;cursor:pointer;animation:pb 1.2s infinite alternate;z-index:6}
@keyframes pb{from{box-shadow:0 0 10px #fbbf24}to{box-shadow:0 0 40px #fbbf24}}
</style></head><body>
<div id="st">
<div id="fl"></div><div id="trk"></div>
<div id="sc"><div id="atw"><div id="atm">
<div class="fa" id="lf"></div><div class="fa" id="rt"></div><div class="fa" id="tp"></div>
<div class="fa" id="fr">
<div class="brand">ATM SIMULATOR</div>
<div id="scw"><div class="scr" id="scr"></div></div>
<div style="position:absolute;left:90px;top:575px;display:grid;grid-template-columns:repeat(3,60px);gap:9px"><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i><i style="height:28px;border-radius:6px;background:#0b1230;border:2px solid #7f8cff"></i></div>
<div id="cs" style="position:absolute;left:370px;top:566px;width:320px;height:170px;overflow:visible"><div class="led" style="left:0;top:36px;width:320px;height:46px"></div><div class="lbl" style="left:112px;top:0">CASH</div></div>
<div class="led" id="slot" style="left:740px;top:620px;width:170px;height:22px"></div><div class="lbl" style="left:772px;top:656px">CARD</div>
</div></div></div></div>
<div id="show"><div id="hint">Your card appears here</div><div id="cw"><div id="card"></div></div></div>
<button id="scanb">Scan card</button>
<div id="ctl"><button id="snd">Sound: on</button><button id="exp">Save backup</button><button id="imp">Load backup</button><input type="file" id="imf" accept=".json" style="display:none"><button id="rst">Reset demo data</button></div>
</div>
<script>
var $=function(i){return document.getElementById(i)},sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var RID='',st=$('st'),scr=$('scr'),card=$('card'),cw=$('cw'),DB,CUR=null,S='welcome',buf='',tries=0,mute=false,K=1,busy=false,INS=false,AC;
var STEPS=['START','Card','PIN','Verify','Menu','Operation','Update','Another?','EXIT'];
$('trk').innerHTML=STEPS.map(function(s){return '<div class="chip">'+s+'</div>'}).join('');
var chips=[].slice.call(document.querySelectorAll('.chip'));
function trk(n){chips.forEach(function(c,i){c.className='chip'+(i<n?' dn':i===n?' on':'')})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inr(n){return '₹ '+Number(n).toLocaleString('en-IN')}
function fid(id){return id.slice(0,4)+' '+id.slice(4)}
function when(t){return new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
function seed(){var n=Date.now();return [{id:'10000001',name:'Demo Customer',pin:'1234',bal:25000,type:'Savings',blocked:false,valid:'12/30',tx:[{t:'Deposit',a:25000,b:25000,d:n-86400000}]}]}
function load(){try{DB=JSON.parse(localStorage.getItem('atmsim')||'null')}catch(e){}if(!DB)DB=seed()}
function save(){try{localStorage.setItem('atmsim',JSON.stringify(DB))}catch(e){}}
load();
function beep(f,d,t,v){if(mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.12));o.stop(AC.currentTime+(d||.12))}catch(e){}}
function good(){beep(660,.1);setTimeout(function(){beep(990,.18)},110)}
function bad(){beep(180,.35,'square',.05)}
function key(){beep(520,.05)}
function fit(){K=Math.min(innerWidth/1600,innerHeight/900);st.style.transform='translate('+(innerWidth-1600*K)/2+'px,'+(innerHeight-900*K)/2+'px) scale('+K+')'}
addEventListener('resize',fit);fit();
addEventListener('mousemove',function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;$('atm').style.setProperty('--ry',(x*5)+'deg');$('atm').style.setProperty('--rx',(-y*3)+'deg')});
function R(h){scr.innerHTML=h;scr.className='scr';void scr.offsetWidth;scr.className='scr in'}
function cardHTML(a){return '<div class="cf cfr"><div class="sh"></div><div class="b1">ATM SIMULATOR</div><div class="ct">'+a.type.toUpperCase()+'</div><div class="chip2"></div><div class="pr2 p"><div class="no">'+fid(a.id)+'</div><div class="nm">'+esc(a.name.toUpperCase())+'</div><div class="vl">VALID THRU '+a.valid+'</div></div><div class="scn"></div></div><div class="cf cbk"><div class="bar"></div><div style="position:absolute;left:22px;top:120px;font-size:19px;line-height:1.4;color:#e0e7ff">Student project card.<br>No real money is used.</div><div style="position:absolute;left:22px;top:205px;font:700 18px Arial;color:#6ee7b7">CARD ID '+fid(a.id)+'</div></div>'}
function showCard(a){CUR=a;INS=false;cw.className='';cw.style.opacity=1;card.style.cssText='';card.className='';card.innerHTML=cardHTML(a);void card.offsetWidth;card.className='in';$('hint').style.display='none'}
function hideCard(){cw.style.opacity=0;setTimeout(function(){card.className='';$('hint').style.display='flex'},600)}
function welcome(){S='welcome';trk(0);buf='';tries=0;$('scanb').style.display='none';if(CUR){hideCard();CUR=null}
R('<h1>Welcome</h1><p>Please choose how you would like to start.</p><div class="rw"><button class="bt pr" data-a="new">Create new account</button><button class="bt" data-a="old">I already have an account</button></div>')}
function createScr(){S='create';R('<h1 style="font-size:36px">Create your account</h1><div class="rw" style="margin-top:4px"><div class="fl"><label>Full name</label><input id="fn" maxlength="22" autocomplete="off"></div></div><div class="rw" style="margin-top:6px"><div class="fl"><label>4-digit PIN</label><input id="p1" type="password" maxlength="4" inputmode="numeric"></div><div class="fl"><label>Confirm PIN</label><input id="p2" type="password" maxlength="4" inputmode="numeric"></div><div class="fl"><label>Opening deposit (₹)</label><input id="dp" value="5000" maxlength="7" inputmode="numeric"></div></div><div class="rw" style="margin-top:8px"><button class="bt sel" data-a="ty" id="t1">Savings</button><button class="bt" data-a="ty" id="t2">Current</button></div><div class="er" id="er"></div><div class="rw" style="margin-top:0"><button class="bt pr" data-a="gen">Generate my card</button><button class="bt" data-a="home">Back</button></div>')}
function oldScr(){S='old';R('<h1 style="font-size:38px">Welcome back</h1><p>Enter the ID number printed on your card.</p><div class="fl" style="margin-top:8px"><label>Card ID (8 digits)</label><input id="ci" maxlength="9" inputmode="numeric" autocomplete="off"></div><p style="color:#fde68a;font-size:20px">Demo card ID: 1000 0001, PIN 1234</p><div class="er" id="er"></div><div class="rw" style="margin-top:0"><button class="bt pr" data-a="find">Continue</button><button class="bt" data-a="home">Back</button></div>');setTimeout(function(){var i=$('ci');if(i)i.focus()},500)}
function restScr(){S='rest';R('<h1 style="font-size:34px">Restore card '+fid(RID)+'</h1><p style="font-size:21px">Enter your details once. The same card ID will work from now on.</p><div class="rw" style="margin-top:2px"><div class="fl"><label>Full name</label><input id="fn" maxlength="22" autocomplete="off"></div><div class="fl"><label>4-digit PIN</label><input id="p1" type="password" maxlength="4" inputmode="numeric"></div><div class="fl"><label>Balance (₹)</label><input id="dp" value="5000" maxlength="7" inputmode="numeric"></div></div><div class="rw" style="margin-top:8px"><button class="bt sel" data-a="ty" id="t1">Savings</button><button class="bt" data-a="ty" id="t2">Current</button></div><div class="er" id="er"></div><div class="rw" style="margin-top:0"><button class="bt pr" data-a="dorest">Restore my card</button><button class="bt" data-a="old">Back</button></div>')}
function toast(m){var t=document.createElement('div');t.textContent=m;t.style.cssText='position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#fbbf24;color:#0b1230;font:700 24px Arial;padding:12px 28px;border-radius:30px;z-index:9';st.appendChild(t);setTimeout(function(){t.remove()},3200)}
function cardReady(msg){S='card';trk(1);R('<h1>'+msg+'</h1><p>Your card is in the tray on the right.</p><p>Press <b style="color:#fbbf24">Scan card</b> to insert it into the machine.</p>');setTimeout(function(){if(S==='card')$('scanb').style.display='block'},1800)}
function rc(el){var r=el.getBoundingClientRect();return{x:(r.left+r.width/2)/K,y:(r.top+r.height/2)/K}}
function tw(d,f){return new Promise(function(r){var t0=performance.now();(function s(t){var u=Math.min(1,(t-t0)/d);f(u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2);u<1?requestAnimationFrame(s):r()})(t0)})}
var FL={};
function put(tx,ty,sc,clip){card.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')';card.style.clipPath=clip>0?'inset(0 0 '+clip+'% 0)':'none'}
async function scan(){if(busy)return;busy=true;$('scanb').style.display='none';S='scan';
R('<div class="sp"></div><h1 style="font-size:36px">Reading your card...</h1><p>Please keep the card in the slot.</p>');
cw.className='fly';card.className='in';card.style.animation='none';
var c=rc(card),s=rc($('slot')),tx=s.x-c.x,ty=s.y-190-c.y;FL={tx:tx,ty:ty};
await tw(950,function(u){put(tx*u,ty*u,1-.38*u,0)});
$('slot').classList.add('act');card.classList.add('scanning');beep(300,.1);await sleep(900);beep(500,.1);await sleep(900);
card.classList.remove('scanning');card.classList.add('okc');good();
R('<div class="ic" style="background:#34d399">&#10003;</div><h1 style="font-size:36px">Card recognised</h1><p>'+esc(CUR.name)+'</p>');
await sleep(900);
var end=ty+190+86;await tw(900,function(u){var y=ty+(end-ty)*u;put(tx,y,.62,Math.max(0,Math.min(100,((y+78)-(ty+190))/156*100)))});
card.style.visibility='hidden';card.classList.remove('okc');INS=true;$('slot').classList.remove('act');
busy=false;if(CUR.blocked){blocked();return}pinScr()}
async function eject(){if(!INS)return;var tx=FL.tx,ty=FL.ty,end=ty+190+86;$('slot').classList.add('act');card.style.visibility='visible';
await tw(900,function(u){var y=end+(ty-end)*u;put(tx,y,.62,Math.max(0,Math.min(100,((y+78)-(ty+190))/156*100)))});
$('slot').classList.remove('act');beep(440,.1);
await tw(1000,function(u){put(tx*(1-u),ty*(1-u),.62+.38*u,0)});
card.style.cssText='';card.style.animation='';cw.className='';INS=false}
function pinScr(msg){S='pin';trk(2);var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<buf.length?'f':'')+'"></i>';var k='';'123456789'.split('').forEach(function(n){k+='<button class="bt" data-a="k" data-k="'+n+'">'+n+'</button>'});k+='<button class="bt" data-a="bk">&#9003;</button><button class="bt" data-a="k" data-k="0">0</button><button class="bt pr" data-a="ok">OK</button>';
R('<div class="hold"><div style="flex:1"><h1 style="font-size:38px">Enter your PIN</h1><p>'+esc(msg||'Hello, '+CUR.name)+'</p><div class="dots">'+d+'</div><p style="color:#fde68a;font-size:20px">'+(3-tries)+' attempts left</p></div><div class="kp">'+k+'</div></div>')}
async function verify(){if(busy)return;busy=true;S='verify';trk(3);R('<div class="sp"></div><h1 style="font-size:36px">Verifying...</h1>');await sleep(1200);busy=false;
if(buf===CUR.pin){tries=0;buf='';good();menu()}else{tries++;buf='';bad();if(tries>=3){CUR.blocked=true;save();blocked();return}pinScr('Wrong PIN. Please try again.');scr.classList.add('shk')}}
function blocked(){S='blocked';trk(2);R('<div class="ic" style="background:#ff6b81">&#10005;</div><h1 style="color:#ff8fa3;font-size:38px">Card blocked</h1><p>Too many wrong PIN attempts. Please contact the bank.</p><div class="rw"><button class="bt pr" data-a="bye">Take my card</button></div>')}
