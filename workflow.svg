<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-label="ATM Simulator animated workflow diagram" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1a"/>
      <stop offset="1" stop-color="#0d1233"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a5e"/>
      <stop offset="1" stop-color="#121a40"/>
    </linearGradient>
    <linearGradient id="menu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b3df5"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <marker id="aCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#59d8ff"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6b81"/></marker>
    <marker id="aGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ffc94d"/></marker>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #eaf0ff; text-anchor: middle; font-size: 15px; }
    .small { font-size: 12.5px; fill: #b8c6ff; }
    .title { font-size: 13px; letter-spacing: 3px; fill: #7f93d9; text-anchor: start; }
    .node { fill: url(#node); stroke: #6ea8ff; stroke-width: 1.6; }
    .ops { fill: url(#node); stroke: #00e5ff; stroke-width: 1.6; }
    .flow { fill: none; stroke: #59d8ff; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1s linear infinite; }
    .bad { fill: none; stroke: #ff6b81; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1s linear infinite; }
    .loop { fill: none; stroke: #ffc94d; stroke-width: 2.2; stroke-dasharray: 7 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -26; } }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .halo { animation: pulse 2.4s ease-in-out infinite; }
  </style>

  <rect width="1000" height="540" rx="18" fill="url(#bg)"/>
  <text class="title" x="26" y="28">SYSTEM WORKFLOW</text>

  <!-- row 1 -->
  <ellipse cx="90" cy="80" rx="58" ry="24" fill="#0f5132" stroke="#3ddc84" stroke-width="1.8"/>
  <text x="90" y="85" font-weight="700">START</text>

  <rect class="node" x="190" y="56" width="140" height="48" rx="12"/>
  <text x="260" y="85">Enter Card No.</text>

  <rect class="node" x="360" y="56" width="140" height="48" rx="12"/>
  <text x="430" y="85">Enter PIN</text>

  <polygon points="530,80 620,38 710,80 620,122" fill="url(#node)" stroke="#ffc94d" stroke-width="1.8"/>
  <text x="620" y="77" font-size="14">Verify</text>
  <text x="620" y="94" font-size="14">Credentials</text>

  <rect x="770" y="56" width="190" height="48" rx="12" fill="#3a1020" stroke="#ff6b81" stroke-width="1.8"/>
  <text x="865" y="85" font-size="13.5">3 wrong PINs → BLOCKED</text>

  <path class="flow" d="M148 80 H188" marker-end="url(#aCyan)"/>
  <path class="flow" d="M330 80 H358" marker-end="url(#aCyan)"/>
  <path class="flow" d="M500 80 H528" marker-end="url(#aCyan)"/>
  <path class="bad" d="M710 80 H768" marker-end="url(#aRed)"/>
  <text class="small" x="740" y="70">Invalid</text>
  <path class="flow" d="M620 122 V168" marker-end="url(#aCyan)"/>
  <text class="small" x="650" y="150">Valid ✓</text>

  <!-- main menu -->
  <rect class="halo" x="466" y="166" width="308" height="60" rx="16" fill="none" stroke="#d946ef" stroke-width="3" filter="url(#glow)"/>
  <rect x="470" y="170" width="300" height="52" rx="14" fill="url(#menu)"/>
  <text x="620" y="203" font-size="19" font-weight="800" letter-spacing="3">MAIN MENU</text>

  <!-- operations -->
  <path class="flow" d="M620 222 C620 258 100 252 100 288" marker-end="url(#aCyan)"/>
  <path class="flow" d="M620 222 C620 258 290 252 290 288" marker-end="url(#aCyan)"/>
  <path class="flow" d="M620 222 C620 258 480 252 480 288" marker-end="url(#aCyan)"/>
  <path class="flow" d="M620 222 C620 258 670 252 670 288" marker-end="url(#aCyan)"/>
  <path class="flow" d="M620 222 C620 258 860 252 860 288" marker-end="url(#aCyan)"/>

  <rect class="ops" x="25" y="290" width="150" height="50" rx="12"/><text x="100" y="320">Balance Enquiry</text>
  <rect class="ops" x="215" y="290" width="150" height="50" rx="12"/><text x="290" y="320">Withdraw Cash</text>
  <rect class="ops" x="405" y="290" width="150" height="50" rx="12"/><text x="480" y="320">Deposit Cash</text>
  <rect class="ops" x="595" y="290" width="150" height="50" rx="12"/><text x="670" y="320">Change PIN</text>
  <rect class="ops" x="785" y="290" width="150" height="50" rx="12"/><text x="860" y="320">Mini Statement</text>

  <!-- converge to update -->
  <path class="flow" d="M100 340 C100 372 500 360 500 398" marker-end="url(#aCyan)"/>
  <path class="flow" d="M290 340 C290 372 500 360 500 398" marker-end="url(#aCyan)"/>
  <path class="flow" d="M480 340 C480 370 500 366 500 398" marker-end="url(#aCyan)"/>
  <path class="flow" d="M670 340 C670 372 500 360 500 398" marker-end="url(#aCyan)"/>
  <path class="flow" d="M860 340 C860 372 500 360 500 398" marker-end="url(#aCyan)"/>

  <rect class="node" x="380" y="400" width="240" height="48" rx="12"/>
  <text x="500" y="429">Update Balance &amp; Records</text>

  <path class="flow" d="M620 424 H668" marker-end="url(#aCyan)"/>

  <polygon points="670,424 760,382 850,424 760,466" fill="url(#node)" stroke="#ffc94d" stroke-width="1.8"/>
  <text x="760" y="429" font-size="14">Another?</text>

  <!-- yes loop back to menu -->
  <path class="loop" d="M850 424 H975 V196 H772" marker-end="url(#aGold)"/>
  <text class="small" x="912" y="414">Yes</text>
  <text class="small" x="991" y="320" transform="rotate(-90 991 320)" style="font-size:11px">back to menu</text>

  <!-- no to exit -->
  <path class="flow" d="M760 466 V486" marker-end="url(#aCyan)"/>
  <text class="small" x="780" y="481">No</text>
  <ellipse cx="760" cy="508" rx="62" ry="22" fill="#3a1020" stroke="#ff6b81" stroke-width="1.8"/>
  <text x="760" y="513" font-weight="700">EXIT</text>
</svg>
